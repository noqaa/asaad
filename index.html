<!-- توليد PWA Manifest و Service Worker داخل نفس الصفحة -->
<script>
(function() {
  // 1. إنشاء PWA Manifest برمجياً
  const manifestData = {
    "name": "ورقة الأسئلة",
    "short_name": "ورقة الأسئلة",
    "description": "تطبيق إعداد وتصميم أوراق الأسئلة الامتحانية",
    "start_url": "./index.html",
    "display": "standalone",
    "background_color": "#eceef3",
    "theme_color": "#2347c5",
    "icons": [
      {
        "src": "logo.jpg",
        "sizes": "192x192 512x512",
        "type": "image/jpeg"
      }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // 2. تسجيل Service Worker مدمج
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'exam-paper-single-v1';
      self.addEventListener('install', (e) => {
        self.skipWaiting();
      });
      self.addEventListener('activate', (e) => {
        e.waitUntil(self.clients.claim());
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swURL = URL.createObjectURL(swBlob);
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(swURL, { scope: './' }).catch(err => {
        console.warn('SW registration skipped or not supported:', err);
      });
    });
  }
})();
</script>

 if(it.type==='box')return'<div class="ans ab" style="height:'+Math.round(n*CM)+'px"></div>';
 if(it.type==='space')return'<div style="height:'+Math.round(n*CM)+'px"></div>';
 if(it.type==='choices'){var o=String(it.options||'').split('\n').map(function(s){return s.trim()}).filter(Boolean).slice(0,6);if(!o.length)return'';
  var long=o.some(function(x){return x.length>26});
  return'<div class="ch'+(long?' one':'')+'">'+o.map(function(x,i){return'<div><span class="lt'+lc()+'">'+L()[i]+')</span>'+esc(x)+'</div>'}).join('')+'</div>'}
 return''}
function block(it,lab,marks,cls){var fit=it.type==='define';
 return'<div class="'+cls+'"><div class="qh"><span class="'+(cls==='q'?'qn':'lt'+lc())+'">'+lab+'</span><span class="qt'+(fit?' fit':'')+'">'+esc(it.text)+'</span>'+(fit?'<span class="qf"></span>':'')+(ml(marks)?'<span class="qm">'+ml(marks)+'</span>':'')+'</div>'+ans(it)+'</div>'}
function newPage(first){var $b=$('<div class="pb"></div>'),$f=$('<div class="pf"></div>');var th=TH[S.theme]||TH.blue;
 var $p=$('<div class="page"></div>').attr('style','--pfs:'+(+S.fsize||17)+'px;--lh:'+(+S.lh||1.75)+';--ln:'+(+S.ln||32)+'px;--pa:'+th[1]+';--dk:'+th[2]+';--soft:'+th[3]+';--pl:'+th[4]+';font-family:"'+S.font+'",Tajawal,sans-serif')
  .append('<div class="strip"></div>',S.frame?'<div class="frm"></div>':null,$b,$f);
 $b.append(first?header():'<div class="mini"><span>'+esc(S.title)+'</span><span>'+esc([S.subject,S.grade].filter(Boolean).join(' — '))+'</span></div>');
 $('#pages').append($p);return{b:$b,f:$f}}
function paginate(){$('#pages').empty();var cur=newPage(true),blocks=[];
 S.q.forEach(function(q,i){blocks.push(block(q,'س'+(i+1),qm(q),'q'));q.br.forEach(function(b,j){blocks.push(block(b,L()[j],b.marks,'br'))})});
 if(S.footer)blocks.push('<div class="cl">'+esc(S.footer)+'</div>');
 if(S.teacher)blocks.push('<div class="ts"><div class="tl">اسم المدرس</div><div style="font-weight:600">'+esc(S.teacher)+'</div></div>');
 blocks.forEach(function(h){var $x=$(h);cur.b.append($x);var e=cur.b[0];if(e.scrollHeight>e.clientHeight+1&&cur.b.children().length>2){$x.detach();cur=newPage(false);cur.b.append($x)}});
 var $pg=$('#pages .page'),n=$pg.length;$pg.each(function(i){$(this).find('.pf').text('صفحة '+(i+1)+' من '+n)});
 $('#stat').text((n===1?'صفحة واحدة':n===2?'صفحتان':n<=10?n+' صفحات':n+' صفحة')+' · '+fmt(total())+' درجة');
 $('#h-th').text('مجموع درجات الأسئلة: '+fmt(auto()));fit()}
function fit(){var w=$('#pp').innerWidth()-24;if(w<=0)return;var s=Math.min(1,w/794);$('#stage').css('transform','scale('+s+')');$('#scaler').css({width:794*s,height:$('#pages').outerHeight()*s})}
if(window.ResizeObserver)new ResizeObserver(fit).observe($('#pp')[0]);$(window).on('resize',fit);

/* ---------- header editor ---------- */
var hh='';HF.forEach(function(f){hh+='<div class="'+(f[2]?'col-span-2':'')+'"><label class="lb">'+f[1]+'</label><input class="inp" data-k="'+f[0]+'" type="'+(f[3]||'text')+'" autocomplete="off"'+(f[3]?' min="0" step="0.5" inputmode="decimal"':'')+'>'+(f[0]==='total'?'<span id="h-th" class="text-xs text-mu"></span>':'')+'</div>'});
CB.forEach(function(c){hh+='<label class="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" class="w-4 h-4 accent-[var(--ac)]" data-k="'+c[0]+'">'+c[1]+'</label>'});
$('#hf').html(hh);
Object.keys(TH).forEach(function(k){$('<button class="w-8 h-8 rounded-full border-2 border-sf"></button>').attr({'data-sw':k,title:TH[k][0]}).css({background:TH[k][1],boxShadow:'0 0 0 1px var(--ln)'}).appendTo('#sw')});
function bind(){$('[data-k]').each(function(){var k=$(this).attr('data-k'),v=S[k];if(this.type==='checkbox')this.checked=k==='govOn'?v!==false:!!v;else this.value=v==null?'':v});
 $('#v-fsize').text(S.fsize);$('#v-lh').text((+S.lh).toFixed(2));$('#v-ln').text(S.ln);
 $('[data-sw]').each(function(){$(this).css('boxShadow',$(this).attr('data-sw')===(S.theme||'blue')?'0 0 0 2.5px var(--fg)':'0 0 0 1px var(--ln)')})}
$(document).on('input change','[data-k]',function(){var k=$(this).attr('data-k'),v=this.type==='checkbox'?this.checked:this.type==='range'?parseFloat(this.value):this.value;S[k]=v;
 if(this.type==='range')$('#v-'+k).text(k==='lh'?v.toFixed(2):v);if(k==='font')loadFont();if(k==='bstyle')renderQ();changed()});
$(document).on('click','[data-sw]',function(){S.theme=$(this).attr('data-sw');bind();changed()});
function loadFont(){if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('400 17px "'+S.font+'"','أبجد'),document.fonts.load('700 17px "'+S.font+'"','أبجد')]).then(paginate).catch(function(){})}

/* ---------- questions editor ---------- */
function get(p){var a=String(p).split('.'),q=S.q[a[0]];return a.length>1?q.br[a[1]]:q}
function ib(act,ic,i,j,title,dis,cls){return'<button class="ib '+(cls||'')+'" data-act="'+act+'" data-i="'+i+'" data-j="'+(j==null?'':j)+'" title="'+title+'" aria-label="'+title+'"'+(dis?' disabled':'')+'><span class="material-icons-outlined">'+ic+'</span></button>'}
function fields(it,p,lab){var t=TY[it.type],o='';
 var h='<div><label class="lb">'+lab+'</label><textarea class="inp" rows="'+(lab==='نص السؤال'?3:2)+'" data-p="'+p+'" data-f="text">'+esc(it.text)+'</textarea></div>';
 h+='<div class="grid grid-cols-2 gap-2"><div><label class="lb">الدرجة</label><input type="number" min="0" step="0.5" class="inp" data-p="'+p+'" data-f="marks" value="'+(it.marks||0)+'"></div><div><label class="lb">مكان الإجابة</label><select class="inp" data-p="'+p+'" data-f="type">';
 Object.keys(TY).forEach(function(k){h+='<option value="'+k+'"'+(k===it.type?' selected':'')+'>'+TY[k][0]+'</option>'});
 h+='</select></div></div>';
 if(t[1])h+='<div><label class="lb">'+t[1]+'</label><div class="flex gap-1.5"><button class="btn !w-9 !px-0 text-lg" data-act="step" data-p="'+p+'" data-d="-1">−</button><input type="number" class="inp text-center" data-p="'+p+'" data-f="size" min="'+t[2]+'" max="'+t[3]+'" value="'+(it.size||t[4])+'"><button class="btn !w-9 !px-0 text-lg" data-act="step" data-p="'+p+'" data-d="1">+</button></div></div>';
 if(it.type==='choices')h+='<div><label class="lb">الخيارات (خيار في كل سطر، حتى 6)</label><textarea class="inp" rows="4" data-p="'+p+'" data-f="options">'+esc(it.options)+'</textarea></div>';
 return h}
function renderQ(){var h='',n=S.q.length;
 if(!n)h='<div class="text-center text-sm text-mu py-4">لا توجد أسئلة. اضغط «إضافة سؤال».</div>';
 S.q.forEach(function(q,i){
  h+='<article class="rounded-xl border border-ln bg-sf2 p-3 space-y-2"><div class="flex items-center justify-between"><span class="px-3 rounded-lg bg-acs text-ac font-semibold text-sm">س'+(i+1)+'</span><div class="flex">'+ib('up','arrow_upward',i,null,'نقل لأعلى',i===0)+ib('down','arrow_downward',i,null,'نقل لأسفل',i===n-1)+ib('dup','content_copy',i,null,'نسخ')+ib('del','delete_outline',i,null,'حذف','', 'hover:!text-dg')+'</div></div>'+fields(q,i,'نص السؤال');
  h+='<div class="border-t border-dashed border-ln pt-2 space-y-2"><div class="text-xs font-semibold text-mu">الفروع (اختياري)</div>';
  q.br.forEach(function(b,j){h+='<div class="rounded-lg border border-ln bg-sf p-2.5 space-y-2"><div class="flex items-center justify-between"><span class="px-2.5 rounded-md bg-acs text-ac text-xs font-semibold">'+L()[j]+')</span>'+ib('delb','delete_outline',i,j,'حذف الفرع','','hover:!text-dg')+'</div>'+fields(b,i+'.'+j,'نص الفرع')+'</div>'});
  h+='<button class="btn w-full !h-8 !border-dashed text-ac" data-act="addb" data-i="'+i+'"'+(q.br.length>=MAXB?' disabled':'')+'><span class="material-icons-outlined">add</span>فرع '+(q.br.length<MAXB?L()[q.br.length]:'')+'</button></div></article>'});
 $('#qs').html(h);S.q.forEach(function(q,i){syncM(i)})}
function syncM(i){var q=S.q[i],s=bsum(q);$('[data-p="'+i+'"][data-f="marks"]').prop('disabled',s>0).val(s>0?fmt(s):q.marks)}
$('#qs').on('input change','[data-f]',function(e){var $e=$(this),p=$e.attr('data-p'),it=get(p),f=$e.attr('data-f'),v=$e.val();
 if(f==='type'){if(e.type!=='change')return;it.type=v;var t=TY[v];if(t[1])it.size=Math.max(t[2],Math.min(t[3],it.size||t[4]));renderQ();return changed()}
 if(f==='marks'){it.marks=parseFloat(v)||0;if(String(p).indexOf('.')>0)syncM(parseInt(p))}
 else if(f==='size'){var n=Math.round(+v),t2=TY[it.type];if(!(n>=t2[2]&&n<=t2[3]))return;it.size=n}
 else it[f]=v;changed()});
$('#qs').on('click','[data-act]',function(){var $b=$(this),a=$b.attr('data-act'),i=+$b.attr('data-i'),j=$b.attr('data-j'),snap=JSON.stringify(S),q=S.q[i];
 if(a==='step'){var it=get($b.attr('data-p')),t=TY[it.type];it.size=Math.max(t[2],Math.min(t[3],(+it.size||t[4])+(+$b.attr('data-d'))));$b.siblings('input').val(it.size);return changed()}
 if(a==='up'||a==='down'){var k=i+(a==='up'?-1:1),x=S.q[k];S.q[k]=q;S.q[i]=x}
 else if(a==='dup'){var c=JSON.parse(JSON.stringify(q));c.id=uid();c.br.forEach(function(b){b.id=uid()});S.q.splice(i+1,0,c)}
 else if(a==='del'){S.q.splice(i,1);toast('تم حذف السؤال','تراجع',function(){S=JSON.parse(snap);bind();renderQ();paginate()})}
 else if(a==='addb'){if(!q.br.length)q.type='none';q.br.push(item('lines',3,0,''))}
 else if(a==='delb'){q.br.splice(+j,1);toast('تم حذف الفرع','تراجع',function(){S=JSON.parse(snap);renderQ();paginate()})}
 renderQ();changed()});
$('#aq').on('click',function(){S.q.push(item('lines',4,5,''));renderQ();changed();var $t=$('#qs textarea').filter('[data-f="text"]').last();$t.focus()[0].scrollIntoView({block:'center',behavior:'smooth'})});
$('#bn').on('click',function(){var snap=JSON.stringify(S);S.q=[item('lines',4,5,'')];S.title=S.subject=S.grade=S.date=S.duration=S.total='';bind();renderQ();paginate();changed();toast('بدأت ورقة جديدة','تراجع',function(){S=JSON.parse(snap);bind();renderQ();paginate()})});

/* ---------- tabs ---------- */
function view(v){$('#pe').toggleClass('hidden',v==='p');$('#pp').toggleClass('hidden',v==='e');
 $('#t1').toggleClass('bg-acs text-ac font-semibold',v==='e').toggleClass('text-mu',v!=='e');$('#t2').toggleClass('bg-acs text-ac font-semibold',v==='p').toggleClass('text-mu',v!=='p');if(v==='p')requestAnimationFrame(fit)}
$('#t1').on('click',function(){view('e')});$('#t2').on('click',function(){view('p');scrollTo(0,0)});

/* ---------- print / PDF ---------- */
var dl=null,busy=false;
(async function(){try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){dl=null}})();
function printSheet(){$('.ph').remove();var $h=$('<div class="ph"></div>').append($('#pages').clone().removeAttr('id')).appendTo('body');
 var off=function(){$h.remove();$(window).off('afterprint',off)};$(window).on('afterprint',off);
 setTimeout(function(){try{window.print()}catch(e){off();toast('تعذر فتح نافذة الطباعة من هذا العرض.')}},150)}
$('#bp').on('click',printSheet);
$('#bd').on('click',async function(){
 if(busy)return;if(!window.html2canvas||!window.jspdf)return toast('تعذر تحميل أداة PDF. تحقق من الاتصال.');
 if(!dl)try{dl=await window.claude.use('downloads')}catch(e){dl=null}
 if(!dl){toast('اختر «حفظ كملف PDF» من نافذة الطباعة.');return printSheet()}
 busy=true;var $btn=$(this).prop('disabled',true);$('#busy').show();var $h=null,sy=scrollY;
 try{scrollTo(0,0);await document.fonts.ready;
  $h=$('<div style="position:absolute;left:0;top:0;width:794px;z-index:0"></div>').append($('#pages').clone().removeAttr('id').css('gap',0)).appendTo('body');
  var els=$h.find('.page').toArray(),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  for(var i=0;i<els.length;i++){var c=await html2canvas(els[i],{scale:2.5,backgroundColor:'#fff',logging:false,useCORS:true,windowWidth:794,windowHeight:1123*els.length});
   if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297,undefined,'FAST')}
  var blob=pdf.output('blob');$h.remove();$h=null;$('#busy').hide();scrollTo(0,sy);
  await dl.save({filename:([S.title,S.subject].filter(Boolean).join(' - ')||'ورقة أسئلة').replace(/[\\/:*?"<>|]+/g,' ').trim()+'.pdf',data:blob});toast('تم حفظ الملف')
 }catch(e){if(!(e&&e.code==='declined'))toast('تعذر إنشاء الملف. حاول مرة أخرى.')}
 finally{if($h)$h.remove();$('#busy').hide();scrollTo(0,sy);busy=false;$btn.prop('disabled',false)}});

bind();renderQ();paginate();loadFont();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paginate);
});
</script>
